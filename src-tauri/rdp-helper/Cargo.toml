[package]
name = "subterm-rdp-helper"
version = "0.1.0"
edition = "2021"
publish = false
description = "RDP client helper for SubTerm. Kept as its own executable (and its own lockfile) because IronRDP's pinned crypto crates cannot share a dependency graph with the SSH stack."

# Its own workspace root: must not be picked up by src-tauri's Cargo.toml.
[workspace]

[dependencies]
ironrdp = { version = "0.17", default-features = false, features = ["core", "pdu", "connector", "session", "graphics", "input", "svc", "dvc", "displaycontrol", "cliprdr", "rdpsnd"] }
ironrdp-blocking = "0.10"
sspi = { version = "0.21", features = ["network_client"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
